services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: teams

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/teams

volumes:
  mongo_data: